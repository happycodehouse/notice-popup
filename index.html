<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="apple-touch-icon" sizes="180x180" href="./resources/images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./resources/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./resources/images/favicon/favicon-16x16.png">
    <link rel="stylesheet" href="./resources/css/lib/swiper-bundle.min.css">
    <link rel="stylesheet" href="./resources/css/style.min.css">
    <title>notice-popup</title>
</head>
<body>
<div class="wrap">
    <header>
        <h1>Notice Popup</h1>
        <a href="https://github.com/happycodehouse/notice-popup" rel="noopener noreferrer" target="_blank">GitHub</a>
        <p>Images sourced from
            <a href="https://adoraudition.world/ko" rel="noopener noreferrer" target="_blank">ador</a> and
            <a href="https://newjeans.kr/">newjeans</a></p>
    </header>
    <div class="container">
        <div class="area area-left">
            <button type="button" data-action="reset">reset</button>
            <div id="mainPopup" data-open="2026/09/10 09:00:00" data-close="2026/09/12 21:59:59">
                <div class="swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <div class="popup-content">
                                <img src="./resources/images/audition-01.jpg" alt="">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popup-footer">
                    <div class="chk_today">
                        <input type="checkbox" id="chkToday">
                        <label for="chkToday">Do not show for one day</label>
                    </div>
                    <div>
                        <div class="swiper-pagination"></div>
                        <button type="button" class="popup_close">Close</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="area area-right">
            <strong>Notice Popup</strong>
            <p>Hide for a day, or close.</p>
            <p>Add or remove slides (max 3).</p>
            <button type="button" data-action="add">Add</button>
            <button type="button" data-action="remove">Remove</button>
        </div>
    </div>
</div>
<script src="./resources/js/lib/swiper-bundle.min.js"></script>
<script>
    (() => {
        const popup = document.getElementById('mainPopup');
        const cookieName = `hide_${popup.id}`;
        const maxSlides = 3;
        const slideImages = ['audition-01.jpg', 'audition-02.jpg', 'audition-03.jpg'];
        let slideCount = 1;

        const addBtn = document.querySelector('[data-action="add"]');
        const removeBtn = document.querySelector('[data-action="remove"]');
        const resetBtn = document.querySelector('[data-action="reset"]');

        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = `${name}=${value}; expires=${date.toUTCString()}; path=/`;
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        function deleteCookie(name) {
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        }

        function isWithinSchedule(open, close) {
            const now = new Date();
            return now >= open && now <= close;
        }

        function parseScheduleDate(str) {
            return new Date(str.replace(/-/g, '/'));
        }

        // 데모용 오버라이드: 접속 시간 기준으로 항상 표시되게 함
        // 배포 시 이 블록을 지우고 아래 실제 값 두 줄을 사용
        const now = new Date();
        const openDate = new Date(now.getTime() - 60 * 1000);
        const closeDate = new Date(now.getTime() + 24 * 60 * 60 * 1000);

        // 실제 배포용 (data-open/data-close 사용 시 위 데모 블록 대신 아래 사용)
        // const openDate = parseScheduleDate(popup.dataset.open);
        // const closeDate = parseScheduleDate(popup.dataset.close);

        const shouldShow = isWithinSchedule(openDate, closeDate) && !getCookie(cookieName);

        if (!shouldShow) {
            popup.style.display = 'none';
        }

        const swiper = new Swiper('.swiper', {
            autoHeight: true,
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
        });

        function updateSwiperState() {
            const isSingle = slideCount <= 1;
            swiper.allowTouchMove = !isSingle;
            swiper.pagination.el.style.display = isSingle ? 'none' : '';
            swiper.update();

            addBtn.disabled = slideCount >= maxSlides;
            removeBtn.disabled = slideCount <= 1;
        }

        updateSwiperState();

        popup.querySelector('.popup_close').addEventListener('click', () => {
            if (document.getElementById('chkToday').checked) {
                setCookie(cookieName, 'true', 1);
            }
            popup.style.display = 'none';
        });

        addBtn.addEventListener('click', () => {
            if (slideCount >= maxSlides) return;
            swiper.appendSlide(`
            <div class="swiper-slide">
                <div class="popup-content">
                    <img src="./resources/images/${slideImages[slideCount]}" alt="">
                </div>
            </div>
        `);
            slideCount++;
            updateSwiperState();
        });

        removeBtn.addEventListener('click', () => {
            if (slideCount <= 1) return;
            swiper.removeSlide(slideCount - 1);
            slideCount--;
            updateSwiperState();
        });

        resetBtn.addEventListener('click', () => {
            deleteCookie(cookieName);
            document.getElementById('chkToday').checked = false;

            while (slideCount > 1) {
                swiper.removeSlide(slideCount - 1);
                slideCount--;
            }
            updateSwiperState();

            popup.style.display = '';
        });
    })();
</script>
</body>
</html>
